[package]
name = "scriptorium"
version = "0.1.0"
edition = "2021"
description = "Copy a Markdown manuscript to and from Jira, Confluence, and Google Docs"
readme = "README.md"
rust-version = "1.85"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
gray_matter = "0.3.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[dev-dependencies]
cucumber = "0.23"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "cucumber"
harness = false
